{{define "nodes-content"}}
<!-- 节点列表 -->
<div class="card">
    <div id="nodes-loading" class="loading">
        <div class="loading-spinner"></div>
        <div>加载中...</div>
    </div>

    <table id="nodes-table" style="display: none;">
        <thead>
            <tr>
                <th>ID</th>
                <th>名称</th>
                <th>类型</th>
                <th>服务器</th>
                <th>网卡</th>
                <th>路由表</th>
                <th>延迟</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="nodes-tbody">
        </tbody>
    </table>
</div>

<!-- 创建/编辑节点模态框 -->
<div id="createNodeModal" class="modal">
    <div class="modal-content" style="max-width: 700px;">
        <div class="modal-header">
            <h3 id="node-modal-title">创建节点</h3>
            <button class="modal-close" onclick="closeModal('createNodeModal')">&times;</button>
        </div>

        <form onsubmit="saveNode(event)">
            <div class="modal-body">
                <input type="hidden" id="node-id">

                <!-- 公共字段 -->
                <div class="form-group">
                    <label>节点名称 *</label>
                    <input type="text" id="node-name" placeholder="例如: 香港节点">
                </div>

                <div class="form-group">
                    <label>中转节点 (Detour)</label>
                    <select id="node-detour">
                        <option value="">无 (直连)</option>
                    </select>
                    <small>通过其他节点进行中转，实现链式代理</small>
                </div>

                <!-- 配置区域 -->
                <div class="form-group">
                    <label>配置</label>
                    <div class="mode-switch" style="margin-top: 10px;">
                        <button type="button" class="switch-btn active" onclick="switchConfigMode('form')">表单模式</button>
                        <button type="button" class="switch-btn" onclick="switchConfigMode('url')">链接模式</button>
                        <button type="button" class="switch-btn" onclick="switchConfigMode('json')">JSON模式</button>
                    </div>
                </div>

                <!-- 表单模式 -->
                <div id="form-mode" class="form-section active">
                    <div class="form-group">
                        <label>节点类型 *</label>
                        <select id="node-type-form" onchange="updateNodeTypeFields()">
                            <option value="socks">SOCKS5</option>
                            <option value="vless">VLESS</option>
                            <option value="vmess">VMess</option>
                            <option value="trojan">Trojan</option>
                        </select>
                    </div>

                    <!-- SOCKS 配置 -->
                    <div id="socks-fields" class="node-type-fields">
                        <div class="form-row">
                            <div class="form-group">
                                <label>服务器地址 *</label>
                                <input type="text" id="socks-server" placeholder="192.168.1.1">
                            </div>
                            <div class="form-group">
                                <label>端口 *</label>
                                <input type="number" id="socks-port" placeholder="1080">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>用户名</label>
                                <input type="text" id="socks-username" placeholder="可选">
                            </div>
                            <div class="form-group">
                                <label>密码</label>
                                <input type="password" id="socks-password" placeholder="可选">
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="checkbox-group">
                                <input type="checkbox" id="socks-udp">
                                <label>启用 UDP over TCP</label>
                            </div>
                        </div>
                    </div>

                    <!-- VLESS 配置 -->
                    <div id="vless-fields" class="node-type-fields" style="display: none;">
                        <div class="form-row">
                            <div class="form-group">
                                <label>服务器地址 *</label>
                                <input type="text" id="vless-server" placeholder="example.com">
                            </div>
                            <div class="form-group">
                                <label>端口 *</label>
                                <input type="number" id="vless-port" placeholder="443">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>UUID *</label>
                            <input type="text" id="vless-uuid" placeholder="a3a8c354-a85c-477b-90f3-dbe08cadf31c">
                        </div>
                        <div class="form-group">
                            <label>Flow</label>
                            <select id="vless-flow">
                                <option value="">无</option>
                                <option value="xtls-rprx-vision">xtls-rprx-vision</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <div class="checkbox-group">
                                <input type="checkbox" id="vless-tls" checked>
                                <label>启用 TLS</label>
                            </div>
                        </div>
                        <div id="vless-tls-fields">
                            <div class="form-group">
                                <label>SNI (Server Name)</label>
                                <input type="text" id="vless-sni" placeholder="www.example.com">
                            </div>
                            <div class="form-group">
                                <div class="checkbox-group">
                                    <input type="checkbox" id="vless-reality">
                                    <label>启用 Reality</label>
                                </div>
                            </div>
                            <div id="vless-reality-fields" style="display: none;">
                                <div class="form-group">
                                    <label>Public Key</label>
                                    <input type="text" id="vless-pubkey" placeholder="zPM3iLhD0ppwxYWzwiXFhQd1PwXCjFN9u28DbXdy604">
                                </div>
                                <div class="form-group">
                                    <label>Short ID</label>
                                    <input type="text" id="vless-shortid" placeholder="a2346cd0">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- VMess 配置 -->
                    <div id="vmess-fields" class="node-type-fields" style="display: none;">
                        <div class="form-row">
                            <div class="form-group">
                                <label>服务器地址 *</label>
                                <input type="text" id="vmess-server" placeholder="example.com">
                            </div>
                            <div class="form-group">
                                <label>端口 *</label>
                                <input type="number" id="vmess-port" placeholder="443">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>UUID *</label>
                            <input type="text" id="vmess-uuid" placeholder="a3a8c354-a85c-477b-90f3-dbe08cadf31c">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>加密方式</label>
                                <select id="vmess-security">
                                    <option value="auto">auto</option>
                                    <option value="aes-128-gcm">aes-128-gcm</option>
                                    <option value="chacha20-poly1305">chacha20-poly1305</option>
                                    <option value="none">none</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Alter ID</label>
                                <input type="number" id="vmess-alterid" value="0">
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="checkbox-group">
                                <input type="checkbox" id="vmess-tls">
                                <label>启用 TLS</label>
                            </div>
                        </div>
                        <div id="vmess-tls-fields" style="display: none;">
                            <div class="form-group">
                                <label>SNI (Server Name)</label>
                                <input type="text" id="vmess-sni" placeholder="example.com">
                            </div>
                        </div>
                    </div>

                    <!-- Trojan 配置 -->
                    <div id="trojan-fields" class="node-type-fields" style="display: none;">
                        <div class="form-row">
                            <div class="form-group">
                                <label>服务器地址 *</label>
                                <input type="text" id="trojan-server" placeholder="example.com">
                            </div>
                            <div class="form-group">
                                <label>端口 *</label>
                                <input type="number" id="trojan-port" placeholder="443">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>密码 *</label>
                            <input type="password" id="trojan-password" placeholder="your-password">
                        </div>
                        <div class="form-group">
                            <label>SNI</label>
                            <input type="text" id="trojan-sni" placeholder="example.com">
                        </div>
                    </div>

                    <!-- 表单模式导出按钮 -->
                    <div class="form-group" style="margin-top: 20px;">
                        <button type="button" class="btn" onclick="generateUrlFromForm()">← 生成协议链接</button>
                    </div>
                </div>

                <!-- URL 链接模式 -->
                <div id="url-mode" class="form-section">
                    <div class="form-group">
                        <label>协议链接 *</label>
                        <textarea id="node-url" placeholder="vless://uuid@server:port?参数..." style="min-height: 150px; font-family: monospace;"></textarea>
                        <small>支持 vless://, vmess://, trojan://, socks5:// 格式</small>
                    </div>
                    <div class="form-group">
                        <button type="button" class="btn" onclick="parseUrlToForm()">→ 解析到表单</button>
                        <button type="button" class="btn" onclick="parseUrlToJson()">→ 解析到JSON</button>
                    </div>
                </div>

                <!-- JSON 模式 -->
                <div id="json-mode" class="form-section">
                    <div class="form-group">
                        <label>配置 (JSON) *</label>
                        <textarea id="node-config-json" placeholder='{"type":"vless","server":"1.2.3.4","server_port":443,...}' style="min-height: 200px; font-family: monospace;"></textarea>
                        <small>请输入完整的 sing-box outbound 配置，必须包含 type 字段</small>
                    </div>
                    <div class="form-group">
                        <button type="button" class="btn" onclick="generateUrlFromJson()">← 生成链接</button>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn" onclick="closeModal('createNodeModal')">取消</button>
                <button type="submit" class="btn btn-primary" id="node-submit-btn">创建</button>
            </div>
        </form>
    </div>
</div>

<!-- 节点日志查看器模态框 -->
<div id="logViewerModal" class="modal">
    <div class="modal-content" style="max-width: 900px;">
        <div class="modal-header">
            <h3 id="log-modal-title">节点日志</h3>
            <button class="modal-close" onclick="closeModal('logViewerModal')">&times;</button>
        </div>

        <div class="log-controls">
            <select id="log-lines">
                <option value="50">最近50行</option>
                <option value="100" selected>最近100行</option>
                <option value="200">最近200行</option>
                <option value="500">最近500行</option>
                <option value="1000">最近1000行</option>
            </select>

            <input type="text" id="log-search" placeholder="搜索关键词..." />

            <div class="btn-group">
                <button class="btn btn-sm" onclick="refreshLogs()" title="刷新日志">⟳ 刷新</button>
                <button class="btn btn-sm btn-warning" onclick="clearNodeLogs()" title="清空日志">🗑 清空</button>
                <button class="btn btn-sm btn-success" onclick="downloadLogs()" title="下载日志">↓ 下载</button>
            </div>
        </div>

        <div class="log-info">
            <span id="log-count">加载中...</span>
            <span id="log-updated">-</span>
        </div>

        <div class="log-viewer" id="log-content">
            <div style="text-align: center; color: #888;">加载中...</div>
        </div>
    </div>
</div>

<!-- 节点查看模态框（配置+日志） -->
<div id="nodeViewerModal" class="modal">
    <div class="modal-content" style="max-width: 900px;">
        <div class="modal-header">
            <h3 id="viewer-modal-title">节点查看</h3>
            <button class="modal-close" onclick="closeModal('nodeViewerModal')">&times;</button>
        </div>

        <div class="modal-body">
            <!-- Tab 切换 -->
            <div class="viewer-tabs">
                <button class="viewer-tab active" onclick="switchViewerTab('config')">配置</button>
                <button class="viewer-tab" onclick="switchViewerTab('logs')">日志</button>
            </div>

            <!-- 配置 Tab -->
            <div id="viewer-config-tab" class="viewer-tab-content active">
                <div class="form-group">
                    <label>配置文件路径</label>
                    <input type="text" id="config-file-path" readonly style="background: #f3f4f6;">
                </div>

                <div class="form-group">
                    <label>完整配置 (JSON)</label>
                    <textarea id="config-content" readonly style="min-height: 500px; font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 15px;"></textarea>
                </div>
            </div>

            <!-- 日志 Tab -->
            <div id="viewer-logs-tab" class="viewer-tab-content">
                <div class="log-controls">
                    <input type="text" id="viewer-log-search" placeholder="搜索日志...">
                    <select id="viewer-log-level">
                        <option value="">全部级别</option>
                        <option value="error">Error</option>
                        <option value="warn">Warn</option>
                        <option value="info">Info</option>
                        <option value="debug">Debug</option>
                    </select>
                    <button class="btn btn-sm" onclick="refreshViewerLogs()">刷新</button>
                    <button class="btn btn-sm btn-warning" onclick="clearViewerLogs()">清空日志</button>
                </div>

                <div class="log-info">
                    <span id="viewer-log-count">加载中...</span>
                    <span id="viewer-last-update"></span>
                </div>

                <div id="viewer-log-content" class="log-viewer">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <div>加载日志中...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-success" onclick="downloadViewerContent()">下载</button>
            <button class="btn" onclick="closeModal('nodeViewerModal')">关闭</button>
        </div>
    </div>
</div>

<script>
// ===== 节点管理模块 =====

// 当前查看日志的节点
let currentLogNodeId = null;
let currentLogNodeName = null;

// 当前配置模式（form, url 或 json）
let currentConfigMode = 'form';

// 切换配置模式
function switchConfigMode(mode) {
    currentConfigMode = mode;
    const formMode = document.getElementById('form-mode');
    const urlMode = document.getElementById('url-mode');
    const jsonMode = document.getElementById('json-mode');
    const btns = document.querySelectorAll('.switch-btn');

    // 更新按钮状态
    btns.forEach((btn, idx) => {
        if ((mode === 'form' && idx === 0) || (mode === 'url' && idx === 1) || (mode === 'json' && idx === 2)) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });

    // 显示/隐藏对应模式
    formMode.classList.remove('active');
    urlMode.classList.remove('active');
    jsonMode.classList.remove('active');

    if (mode === 'form') {
        formMode.classList.add('active');
    } else if (mode === 'url') {
        urlMode.classList.add('active');
    } else {
        jsonMode.classList.add('active');
    }
}

// 更新节点类型字段显示
function updateNodeTypeFields() {
    const type = document.getElementById('node-type-form').value;
    document.querySelectorAll('.node-type-fields').forEach(f => f.style.display = 'none');
    const fields = document.getElementById(type + '-fields');
    if (fields) {
        fields.style.display = 'block';
    }
}

// 从表单构建配置JSON
function buildConfigFromForm() {
    const type = document.getElementById('node-type-form').value;
    let config = { type };

    if (type === 'socks') {
        config.server = document.getElementById('socks-server').value;
        config.server_port = parseInt(document.getElementById('socks-port').value) || 1080;

        const username = document.getElementById('socks-username').value;
        const password = document.getElementById('socks-password').value;
        if (username) config.username = username;
        if (password) config.password = password;

        const udp = document.getElementById('socks-udp').checked;
        if (udp) config.udp_over_tcp = true;

        config.version = "5";
    } else if (type === 'vless') {
        config.server = document.getElementById('vless-server').value;
        config.server_port = parseInt(document.getElementById('vless-port').value) || 443;
        config.uuid = document.getElementById('vless-uuid').value;

        const flow = document.getElementById('vless-flow').value;
        if (flow) config.flow = flow;

        const tlsEnabled = document.getElementById('vless-tls').checked;
        if (tlsEnabled) {
            config.tls = { enabled: true };

            const sni = document.getElementById('vless-sni').value;
            if (sni) config.tls.server_name = sni;

            const realityEnabled = document.getElementById('vless-reality').checked;
            if (realityEnabled) {
                const pubkey = document.getElementById('vless-pubkey').value;
                const shortid = document.getElementById('vless-shortid').value;

                config.tls.reality = {
                    enabled: true,
                    public_key: pubkey,
                    short_id: shortid
                };

                config.tls.utls = {
                    enabled: true,
                    fingerprint: "chrome"
                };
            }
        }
    } else if (type === 'vmess') {
        config.server = document.getElementById('vmess-server').value;
        config.server_port = parseInt(document.getElementById('vmess-port').value) || 443;
        config.uuid = document.getElementById('vmess-uuid').value;

        const security = document.getElementById('vmess-security').value;
        if (security) config.security = security;

        const alterid = parseInt(document.getElementById('vmess-alterid').value);
        if (alterid) config.alter_id = alterid;

        const tlsEnabled = document.getElementById('vmess-tls').checked;
        if (tlsEnabled) {
            config.tls = { enabled: true };
            const sni = document.getElementById('vmess-sni').value;
            if (sni) config.tls.server_name = sni;
        }
    } else if (type === 'trojan') {
        config.server = document.getElementById('trojan-server').value;
        config.server_port = parseInt(document.getElementById('trojan-port').value) || 443;
        config.password = document.getElementById('trojan-password').value;

        config.tls = { enabled: true };
        const sni = document.getElementById('trojan-sni').value;
        if (sni) config.tls.server_name = sni;
    }

    // 处理中转节点 (Detour) - 使用统一的ID
    const detour = document.getElementById('node-detour').value;
    if (detour) {
        config.detour = detour;
    }

    return config;
}

// 从配置JSON加载到表单
function loadConfigToForm(config) {
    const type = config.type;
    document.getElementById('node-type-form').value = type;
    updateNodeTypeFields();

    // 加载中转节点 - 使用统一的ID
    document.getElementById('node-detour').value = config.detour || '';

    if (type === 'socks') {
        document.getElementById('socks-server').value = config.server || '';
        document.getElementById('socks-port').value = config.server_port || 1080;
        document.getElementById('socks-username').value = config.username || '';
        document.getElementById('socks-password').value = config.password || '';
        document.getElementById('socks-udp').checked = config.udp_over_tcp || false;
    } else if (type === 'vless') {
        document.getElementById('vless-server').value = config.server || '';
        document.getElementById('vless-port').value = config.server_port || 443;
        document.getElementById('vless-uuid').value = config.uuid || '';
        document.getElementById('vless-flow').value = config.flow || '';

        if (config.tls && config.tls.enabled) {
            document.getElementById('vless-tls').checked = true;
            document.getElementById('vless-sni').value = config.tls.server_name || '';

            if (config.tls.reality && config.tls.reality.enabled) {
                document.getElementById('vless-reality').checked = true;
                document.getElementById('vless-pubkey').value = config.tls.reality.public_key || '';
                document.getElementById('vless-shortid').value = config.tls.reality.short_id || '';
                document.getElementById('vless-reality-fields').style.display = 'block';
            }
        }
    } else if (type === 'vmess') {
        document.getElementById('vmess-server').value = config.server || '';
        document.getElementById('vmess-port').value = config.server_port || 443;
        document.getElementById('vmess-uuid').value = config.uuid || '';
        document.getElementById('vmess-security').value = config.security || 'auto';
        document.getElementById('vmess-alterid').value = config.alter_id || 0;

        if (config.tls && config.tls.enabled) {
            document.getElementById('vmess-tls').checked = true;
            document.getElementById('vmess-sni').value = config.tls.server_name || '';
            document.getElementById('vmess-tls-fields').style.display = 'block';
        }
    } else if (type === 'trojan') {
        document.getElementById('trojan-server').value = config.server || '';
        document.getElementById('trojan-port').value = config.server_port || 443;
        document.getElementById('trojan-password').value = config.password || '';
        document.getElementById('trojan-sni').value = (config.tls && config.tls.server_name) || '';
    }
}

// ===== 协议链接解析和生成函数 =====

// 从协议链接解析配置
function parseUrlToConfig(url) {
    url = url.trim();

    if (url.startsWith('vless://')) {
        return parseVlessUrl(url);
    } else if (url.startsWith('vmess://')) {
        return parseVmessUrl(url);
    } else if (url.startsWith('trojan://')) {
        return parseTrojanUrl(url);
    } else if (url.startsWith('socks5://') || url.startsWith('socks://')) {
        return parseSocksUrl(url);
    } else {
        throw new Error('不支持的协议类型');
    }
}

// 解析 VLESS URL
function parseVlessUrl(url) {
    // vless://uuid@server:port?参数
    const match = url.match(/^vless:\/\/([^@]+)@([^:?]+):(\d+)(\?.*)?$/);
    if (!match) throw new Error('VLESS URL 格式错误');

    const [, uuid, server, port, queryStr] = match;
    const params = new URLSearchParams(queryStr || '');

    const config = {
        type: 'vless',
        server: server,
        server_port: parseInt(port),
        uuid: uuid
    };

    // flow
    if (params.get('flow')) {
        config.flow = params.get('flow');
    }

    // encryption
    if (params.get('encryption')) {
        config.encryption = params.get('encryption');
    }

    // TLS/Reality
    const security = params.get('security');
    if (security === 'tls' || security === 'reality') {
        config.tls = { enabled: true };

        if (params.get('sni')) {
            config.tls.server_name = params.get('sni');
        }

        if (security === 'reality') {
            config.tls.reality = { enabled: true };
            if (params.get('pbk')) {
                config.tls.reality.public_key = params.get('pbk');
            }
            if (params.get('sid')) {
                config.tls.reality.short_id = params.get('sid');
            }
        }

        // uTLS fingerprint
        if (params.get('fp')) {
            config.tls.utls = {
                enabled: true,
                fingerprint: params.get('fp')
            };
        }
    }

    return config;
}

// 解析 VMess URL
function parseVmessUrl(url) {
    // vmess://base64(json)
    const base64Str = url.substring(8);
    try {
        const jsonStr = atob(base64Str);
        const vmessObj = JSON.parse(jsonStr);

        const config = {
            type: 'vmess',
            server: vmessObj.add,
            server_port: parseInt(vmessObj.port),
            uuid: vmessObj.id
        };

        if (vmessObj.aid) {
            config.alter_id = parseInt(vmessObj.aid);
        }

        if (vmessObj.scy) {
            config.security = vmessObj.scy;
        }

        // TLS
        if (vmessObj.tls === 'tls') {
            config.tls = { enabled: true };
            if (vmessObj.sni) {
                config.tls.server_name = vmessObj.sni;
            }
        }

        return config;
    } catch (e) {
        throw new Error('VMess URL 解析失败: ' + e.message);
    }
}

// 解析 Trojan URL
function parseTrojanUrl(url) {
    // trojan://password@server:port?参数
    const match = url.match(/^trojan:\/\/([^@]+)@([^:?]+):(\d+)(\?.*)?$/);
    if (!match) throw new Error('Trojan URL 格式错误');

    const [, password, server, port, queryStr] = match;
    const params = new URLSearchParams(queryStr || '');

    const config = {
        type: 'trojan',
        server: server,
        server_port: parseInt(port),
        password: decodeURIComponent(password),
        tls: { enabled: true }
    };

    if (params.get('sni')) {
        config.tls.server_name = params.get('sni');
    }

    return config;
}

// 解析 SOCKS5 URL
function parseSocksUrl(url) {
    // socks5://[username:password@]server:port
    const match = url.match(/^socks5?:\/\/(?:([^:]+):([^@]+)@)?([^:]+):(\d+)$/);
    if (!match) throw new Error('SOCKS URL 格式错误');

    const [, username, password, server, port] = match;

    const config = {
        type: 'socks',
        server: server,
        server_port: parseInt(port),
        version: '5'
    };

    if (username) {
        config.username = decodeURIComponent(username);
    }
    if (password) {
        config.password = decodeURIComponent(password);
    }

    return config;
}

// 从配置生成协议链接
function configToUrl(config) {
    const type = config.type;

    if (type === 'vless') {
        return generateVlessUrl(config);
    } else if (type === 'vmess') {
        return generateVmessUrl(config);
    } else if (type === 'trojan') {
        return generateTrojanUrl(config);
    } else if (type === 'socks') {
        return generateSocksUrl(config);
    } else {
        throw new Error('不支持的协议类型: ' + type);
    }
}

// 生成 VLESS URL
function generateVlessUrl(config) {
    let url = `vless://${config.uuid}@${config.server}:${config.server_port}`;
    const params = new URLSearchParams();

    if (config.flow) {
        params.set('flow', config.flow);
    }

    params.set('encryption', config.encryption || 'none');

    if (config.tls && config.tls.enabled) {
        if (config.tls.reality && config.tls.reality.enabled) {
            params.set('security', 'reality');
            if (config.tls.reality.public_key) {
                params.set('pbk', config.tls.reality.public_key);
            }
            if (config.tls.reality.short_id) {
                params.set('sid', config.tls.reality.short_id);
            }
        } else {
            params.set('security', 'tls');
        }

        if (config.tls.server_name) {
            params.set('sni', config.tls.server_name);
        }

        if (config.tls.utls && config.tls.utls.fingerprint) {
            params.set('fp', config.tls.utls.fingerprint);
        }
    } else {
        params.set('security', 'none');
    }

    params.set('type', 'tcp');
    params.set('headerType', 'none');

    return url + '?' + params.toString();
}

// 生成 VMess URL
function generateVmessUrl(config) {
    const vmessObj = {
        v: '2',
        ps: '',
        add: config.server,
        port: String(config.server_port),
        id: config.uuid,
        aid: String(config.alter_id || 0),
        scy: config.security || 'auto',
        net: 'tcp',
        type: 'none',
        host: '',
        path: '',
        tls: (config.tls && config.tls.enabled) ? 'tls' : '',
        sni: (config.tls && config.tls.server_name) || ''
    };

    const jsonStr = JSON.stringify(vmessObj);
    const base64Str = btoa(jsonStr);
    return 'vmess://' + base64Str;
}

// 生成 Trojan URL
function generateTrojanUrl(config) {
    let url = `trojan://${encodeURIComponent(config.password)}@${config.server}:${config.server_port}`;
    const params = new URLSearchParams();

    if (config.tls && config.tls.server_name) {
        params.set('sni', config.tls.server_name);
    }

    params.set('type', 'tcp');

    const queryStr = params.toString();
    return queryStr ? url + '?' + queryStr : url;
}

// 生成 SOCKS5 URL
function generateSocksUrl(config) {
    let url = 'socks5://';

    if (config.username && config.password) {
        url += `${encodeURIComponent(config.username)}:${encodeURIComponent(config.password)}@`;
    }

    url += `${config.server}:${config.server_port}`;
    return url;
}

// 加载节点列表
async function loadNodes() {
    const tbody = document.getElementById('nodes-tbody');
    const loading = document.getElementById('nodes-loading');
    const table = document.getElementById('nodes-table');

    try {
        const res = await authFetch(`${API_BASE}/nodes`);
        const data = await res.json();

        loading.style.display = 'none';
        table.style.display = 'table';

        if (!data.data || data.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; color: #9ca3af;">暂无节点</td></tr>';
            return;
        }

        tbody.innerHTML = data.data.map(node => {
            let config = {};
            try {
                config = JSON.parse(node.config);
            } catch (e) {}
            const server = config.server || '-';

            // 计算延迟显示
            let latencyHtml = '';
            if (node.status !== 'running') {
                latencyHtml = '<span class="latency latency-unavailable">-</span>';
            } else if (!node.available) {
                latencyHtml = '<span class="latency latency-unavailable">离线</span>';
            } else {
                const latency = node.latency || 0;
                let latencyClass = 'latency-excellent';
                if (latency > 300) {
                    latencyClass = 'latency-poor';
                } else if (latency > 100) {
                    latencyClass = 'latency-good';
                }
                latencyHtml = `<span class="latency ${latencyClass}">${latency}ms</span>`;
            }

            return `
            <tr>
                <td>${node.id}</td>
                <td><strong>${node.name}</strong></td>
                <td>${node.type.toUpperCase()}</td>
                <td>${server}</td>
                <td>${node.tun_name || '-'}</td>
                <td><code>${node.table_id}</code></td>
                <td>${latencyHtml}</td>
                <td><span class="status status-${node.status}">${node.status}</span></td>
                <td>
                    <div class="actions">
                        ${node.status === 'running'
                            ? `<button class="btn btn-sm btn-warning" onclick="stopNode(${node.id})">停止</button>`
                            : `<button class="btn btn-sm btn-success" onclick="startNode(${node.id})">启动</button>`
                        }
                        <button class="btn btn-sm" onclick="restartNode(${node.id})">重启</button>
                        <button class="btn btn-sm" onclick="viewNode(${node.id}, '${node.name}')">查看</button>
                        <button class="btn btn-sm" onclick="editNode(${node.id})">编辑</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteNode(${node.id}, '${node.name}')">删除</button>
                    </div>
                </td>
            </tr>
        `}).join('');
    } catch (e) {
        console.error('加载节点失败:', e);
        loading.textContent = '加载失败';
    }
}

// 节点操作 - 保存（创建或更新）
async function saveNode(e) {
    e.preventDefault();

    const nodeId = document.getElementById('node-id').value;
    const isEdit = nodeId !== '';

    // 节点名称使用统一的公共字段
    const name = document.getElementById('node-name').value;
    if (!name || !name.trim()) {
        showToast('请填写节点名称', 'error');
        return;
    }

    let type, configText;

    if (currentConfigMode === 'form') {
        // 表单模式 - 从表单构建配置
        type = document.getElementById('node-type-form').value;
        const config = buildConfigFromForm();
        configText = JSON.stringify(config);
    } else if (currentConfigMode === 'url') {
        // URL模式 - 从链接解析配置
        const url = document.getElementById('node-url').value;

        if (!url || !url.trim()) {
            showToast('请输入协议链接', 'error');
            return;
        }

        try {
            const config = parseUrlToConfig(url);
            type = config.type;
            configText = JSON.stringify(config);
        } catch (err) {
            showToast('链接解析失败: ' + err.message, 'error');
            return;
        }
    } else {
        // JSON模式 - 直接使用JSON，从JSON中提取type
        configText = document.getElementById('node-config-json').value;

        // 验证JSON格式并提取type
        try {
            const config = JSON.parse(configText);
            if (!config.type) {
                showToast('JSON配置中缺少 type 字段', 'error');
                return;
            }
            type = config.type;
        } catch {
            showToast('JSON 格式错误，请检查配置', 'error');
            return;
        }
    }

    const url = isEdit ? `${API_BASE}/nodes/${nodeId}` : `${API_BASE}/nodes`;
    const method = isEdit ? 'PUT' : 'POST';

    const requestBody = {
        name,
        type,
        config: configText,
        enabled: true
    };

    const res = await authFetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody)
    });

    const data = await res.json();
    if (data.code === 0) {
        showToast(
            isEdit ? '节点已更新，请重启节点使配置生效' : `节点创建成功！ID: ${data.data.id}`,
            'success'
        );
        closeModal('createNodeModal');
        loadNodes();
    } else {
        showToast((isEdit ? '更新' : '创建') + '失败: ' + data.message, 'error');
    }
}

    currentLogNodeId = nodeId;
    currentLogNodeName = nodeName;

    document.getElementById('log-modal-title').textContent = `节点日志 - ${nodeName}`;
    document.getElementById('log-search').value = '';

    // 添加事件监听器
    const logLinesSelect = document.getElementById('log-lines');
    const logSearchInput = document.getElementById('log-search');

    logLinesSelect.onchange = () => loadLogs();
    logSearchInput.oninput = (e) => {
        const keyword = e.target.value.trim();
        if (keyword) {
            searchLogs(keyword);
        } else {
            loadLogs();
        }
    };

    // 显示模态框
    openModal('logViewerModal');

    // 加载日志
    await loadLogs();
}

// 加载日志
async function loadLogs() {
    if (!currentLogNodeId) return;

    const lines = document.getElementById('log-lines').value;
    const logContent = document.getElementById('log-content');
    const logCount = document.getElementById('log-count');
    const logUpdated = document.getElementById('log-updated');

    logContent.innerHTML = '<div style="text-align: center; color: #888;">加载中...</div>';

    try {
        const res = await authFetch(`${API_BASE}/nodes/${currentLogNodeId}/logs?lines=${lines}`);
        const data = await res.json();

        if (data.code === 0) {
            const logs = data.data.logs || [];

            if (logs.length === 0) {
                logContent.innerHTML = '<div style="text-align: center; color: #888;">暂无日志</div>';
                logCount.textContent = '共 0 行';
            } else {
                // 移除 ANSI 颜色代码并显示日志
                logContent.innerHTML = logs.map(log => {
                    // 移除 ANSI 转义序列
                    const cleanLog = log.replace(/\x1b\[[0-9;]*m/g, '');
                    return `<div class="log-line">${escapeHtml(cleanLog)}</div>`;
                }).join('');

                // 滚动到底部
                logContent.scrollTop = logContent.scrollHeight;

                // 更新信息
                logCount.textContent = `共 ${logs.length} 行`;
                logUpdated.textContent = `最后更新: ${new Date().toLocaleTimeString()}`;
            }
        } else {
            logContent.innerHTML = `<div style="text-align: center; color: #888;">加载失败: ${data.message}</div>`;
        }
    } catch (error) {
        logContent.innerHTML = `<div style="text-align: center; color: #888;">加载失败: ${error.message}</div>`;
    }
}

// 搜索日志
async function searchLogs(keyword) {
    if (!currentLogNodeId || !keyword) return;

    const lines = document.getElementById('log-lines').value;
    const logContent = document.getElementById('log-content');
    const logCount = document.getElementById('log-count');

    try {
        const res = await authFetch(`${API_BASE}/nodes/${currentLogNodeId}/logs?lines=${lines}&search=${encodeURIComponent(keyword)}`);
        const data = await res.json();

        if (data.code === 0) {
            const logs = data.data.logs || [];

            if (logs.length === 0) {
                logContent.innerHTML = `<div style="text-align: center; color: #888;">未找到包含 "${keyword}" 的日志</div>`;
                logCount.textContent = '共 0 行';
            } else {
                logContent.innerHTML = logs.map(log => {
                    const cleanLog = log.replace(/\x1b\[[0-9;]*m/g, '');
                    // 高亮关键词
                    const highlighted = cleanLog.replace(
                        new RegExp(keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'),
                        match => `<mark style="background: yellow; color: black;">${match}</mark>`
                    );
                    return `<div class="log-line">${highlighted}</div>`;
                }).join('');

                logCount.textContent = `共 ${logs.length} 行`;
            }
        }
    } catch (error) {
        logContent.innerHTML = `<div style="text-align: center; color: #888;">搜索失败: ${error.message}</div>`;
    }
}

// 刷新日志
function refreshLogs() {
    const searchKeyword = document.getElementById('log-search').value.trim();
    if (searchKeyword) {
        searchLogs(searchKeyword);
    } else {
        loadLogs();
    }
}

// 清空日志
async function clearNodeLogs() {
    if (!currentLogNodeId) return;

    if (!confirm(`确定要清空节点 "${currentLogNodeName}" 的所有日志吗？\n此操作不可恢复！`)) {
        return;
    }

    try {
        const res = await authFetch(`${API_BASE}/nodes/${currentLogNodeId}/logs/clear`, {
            method: 'POST'
        });
        const data = await res.json();

        if (data.code === 0) {
            showToast('日志已清空', 'success');
            loadLogs();
        } else {
            showToast('清空失败: ' + data.message, 'error');
        }
    } catch (error) {
        showToast('清空失败: ' + error.message, 'error');
    }
}

// 下载日志
async function downloadLogs() {
    if (!currentLogNodeId) return;

    try {
        const lines = document.getElementById('log-lines').value;
        const res = await authFetch(`${API_BASE}/nodes/${currentLogNodeId}/logs?lines=${lines}`);
        const data = await res.json();

        if (data.code === 0 && data.data.logs) {
            const logs = data.data.logs;
            const cleanLogs = logs.map(log => log.replace(/\x1b\[[0-9;]*m/g, '')).join('\n');

            // 创建下载
            const blob = new Blob([cleanLogs], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `node_${currentLogNodeId}_${currentLogNodeName}_${new Date().toISOString().replace(/[:.]/g, '-')}.log`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast('日志已下载', 'success');
        } else {
            showToast('下载失败: ' + data.message, 'error');
        }
    } catch (error) {
        showToast('下载失败: ' + error.message, 'error');
    }
}

// HTML转义函数
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

document.addEventListener('DOMContentLoaded', function() {
    loadNodes();

    // VLESS Reality切换
    const vlessReality = document.getElementById('vless-reality');
    if (vlessReality) {
        vlessReality.addEventListener('change', function() {
            document.getElementById('vless-reality-fields').style.display =
                this.checked ? 'block' : 'none';
        });
    }

    // VMess TLS切换
    const vmessTls = document.getElementById('vmess-tls');
    if (vmessTls) {
        vmessTls.addEventListener('change', function() {
            document.getElementById('vmess-tls-fields').style.display =
                this.checked ? 'block' : 'none';
        });
    }
});
</script>
