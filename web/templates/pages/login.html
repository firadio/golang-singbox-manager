{{define "login"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">{{.Title}} - Sing-Box Manager</title>
    <link rel="stylesheet" href="/static/css/common.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 id="login-title">🚀 Sing-Box Manager</h1>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group" id="usernameGroup">
                    <label for="username">用户名</label>
                    <input type="text" id="username" autofocus>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">登录</button>
            </form>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script>
        let usernameRequired = true;

        // 检查是否需要用户名
        async function checkUsernameRequired() {
            try {
                const response = await fetch('/api/auth/config');
                const data = await response.json();

                if (data.code === 0 && data.data) {
                    // 更新设备名称
                    if (data.data.device_name) {
                        const deviceName = data.data.device_name;
                        const pageTitle = document.getElementById('page-title');
                        const loginTitle = document.getElementById('login-title');

                        // 更新页面标题
                        const currentTitle = pageTitle.textContent.split(' - ')[0];
                        pageTitle.textContent = `${currentTitle} - ${deviceName}`;

                        // 更新登录框标题
                        loginTitle.textContent = `🚀 ${deviceName}`;
                    }

                    // 如果没有设置用户名，隐藏用户名字段
                    usernameRequired = data.data.username_required || false;

                    const usernameGroup = document.getElementById('usernameGroup');
                    const usernameInput = document.getElementById('username');
                    const passwordInput = document.getElementById('password');

                    if (!usernameRequired) {
                        usernameGroup.style.display = 'none';
                        usernameInput.removeAttribute('required');
                        passwordInput.focus(); // 将焦点移到密码框
                    } else {
                        usernameGroup.style.display = 'block';
                        usernameInput.setAttribute('required', 'required');
                        usernameInput.focus(); // 将焦点移到用户名框
                    }
                }
            } catch (error) {
                console.error('Failed to check username requirement:', error);
            }
        }

        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const loginData = { password };
            if (usernameRequired) {
                loginData.username = username;
            }

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin', // 确保接收并保存 cookie
                    body: JSON.stringify(loginData)
                });

                const data = await response.json();

                if (data.code === 0) {
                    // Cookie 已由服务器设置，无需手动处理
                    showToast('登录成功', 'success');
                    setTimeout(() => {
                        window.location.href = '/nodes';
                    }, 500);
                } else {
                    showToast(data.message || '登录失败', 'error');
                }
            } catch (error) {
                showToast('登录失败: ' + error.message, 'error');
            }
        }

        // 初始化登录页面
        async function initLoginPage() {
            // 先检查认证功能是否开启
            try {
                const response = await fetch('/api/auth/config');
                const data = await response.json();

                if (data.code === 0 && data.data) {
                    // 如果认证功能未开启，直接跳转到首页
                    if (!data.data.auth_enabled) {
                        window.location.href = '/nodes';
                        return;
                    }
                }
            } catch (error) {
                console.error('Failed to check auth config:', error);
            }

            // 如果已登录，直接跳转
            if (isAuthenticated()) {
                window.location.href = '/nodes';
            } else {
                // 检查是否需要用户名
                checkUsernameRequired();
            }
        }

        // 初始化
        initLoginPage();
    </script>
</body>
</html>
{{end}}
