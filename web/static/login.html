<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Sing-Box Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .login-title {
            font-size: 28px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            border-left: 4px solid #dc2626;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
        }

        .checkbox-group label {
            font-size: 14px;
            color: #6b7280;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-icon">🔐</div>
            <h1 class="login-title">登录验证</h1>
            <p class="login-subtitle">请输入管理密码以继续</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="password">管理密码</label>
                <input type="password" id="password" placeholder="请输入密码" required autofocus>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="remember">
                <label for="remember">记住密码（7天）</label>
            </div>

            <button type="submit" class="btn-login">登录</button>
        </form>
    </div>

    <script>
        const API_BASE = '/api';

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => {
                errorEl.classList.remove('show');
            }, 3000);
        }

        async function handleLogin(event) {
            event.preventDefault();

            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();

                if (data.code === 0) {
                    // 登录成功，存储密码
                    if (remember) {
                        // 记住7天
                        const expireTime = Date.now() + 7 * 24 * 60 * 60 * 1000;
                        localStorage.setItem('auth_password', password);
                        localStorage.setItem('auth_expire', expireTime);
                    } else {
                        // 仅本次会话
                        sessionStorage.setItem('auth_password', password);
                    }

                    // 跳转回主页
                    const returnUrl = new URLSearchParams(window.location.search).get('return') || '/static/index.html';
                    window.location.href = returnUrl;
                } else {
                    showError(data.message || '登录失败');
                }
            } catch (error) {
                showError('登录失败: ' + error.message);
            }
        }

        // 页面加载时检查是否已登录
        window.addEventListener('load', async () => {
            const password = getStoredPassword();
            if (password) {
                // 验证密码是否有效
                try {
                    const res = await fetch(`${API_BASE}/system/info`, {
                        headers: { 'X-Auth-Password': password }
                    });

                    if (res.status === 200) {
                        // 密码有效，直接跳转
                        const returnUrl = new URLSearchParams(window.location.search).get('return') || '/static/index.html';
                        window.location.href = returnUrl;
                        return;
                    }
                } catch (e) {
                    console.log('Auth check failed:', e);
                }

                // 密码无效，清除存储
                localStorage.removeItem('auth_password');
                localStorage.removeItem('auth_expire');
                sessionStorage.removeItem('auth_password');
            }
        });

        function getStoredPassword() {
            // 先检查localStorage
            const savedPassword = localStorage.getItem('auth_password');
            const expireTime = localStorage.getItem('auth_expire');
            if (savedPassword && expireTime && Date.now() < parseInt(expireTime)) {
                return savedPassword;
            }

            // 清理过期的localStorage
            if (savedPassword && expireTime) {
                localStorage.removeItem('auth_password');
                localStorage.removeItem('auth_expire');
            }

            // 再检查sessionStorage
            return sessionStorage.getItem('auth_password');
        }
    </script>
</body>
</html>
